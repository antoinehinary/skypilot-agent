name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint and unit tests (no simulator, no LLM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # The annotate plugin turns each failing test into a GitHub annotation (file, line, error).
        run: pip install -e ".[agent,dev]" "pytest-github-actions-annotate-failures==0.4.2"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -m "not sim" -rs

  simulator-tests:
    name: Simulator tests (headless PyBullet, scripted LLM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GYM_PYBULLET_DRONES_COMMIT: 15c426c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip  # also keeps the pybullet wheel built from source (no cp312 wheel on PyPI)
      - name: Fetch gym-pybullet-drones
        run: |
          git clone https://github.com/learnsyslab/gym-pybullet-drones.git external/gym-pybullet-drones
          git -C external/gym-pybullet-drones checkout "$GYM_PYBULLET_DRONES_COMMIT"
      - name: Install
        run: |
          pip install -e ".[sim,agent,dev]" "pytest-github-actions-annotate-failures==0.4.2"
          pip install -e external/gym-pybullet-drones --no-deps
      - name: Simulator tests
        run: pytest -m sim -rs
