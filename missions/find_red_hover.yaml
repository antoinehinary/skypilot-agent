id: find_red_hover
category: vision
text: "Find the red box and hover above it."
checks:
  - {type: landed, expected: false}
  - {type: final_position, object: red_box, tolerance_m: 0.15}
reference:
  - "print(takeoff(altitude_m=2.5))"
  - |
    import re
    found = find_objects(colour="red")
    print(found)
    x, y = map(float, re.search(r"at \(([-\d.]+), ([-\d.]+)\)", found).groups())
    print(goto(x_m=x, y_m=y, z_m=2.5))
  - |
    found = find_objects(colour="red")
