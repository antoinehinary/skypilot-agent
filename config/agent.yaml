# Agent and LLM parameters. MODEL_ID / OLLAMA_API_BASE environment variables (or a .env file)
# override model_id / api_base; the --model CLI flag overrides both.

model_id: ollama_chat/qwen3:8b
api_base: http://localhost:11434
request_timeout_s: 120      # per LLM call
max_tokens: 2048            # cap per reply; without it some prompts ran past the timeout
temperature: 0.0            # greedy decoding
seed: 42                    # with temperature 0, makes runs repeatable within a session; across
                            # sessions Ollama can still differ slightly (GPU arithmetic, batching)
max_steps: 12               # agent reasoning/action steps before giving up
planning_interval: null     # N: smolagents writes an explicit plan every N steps (null: never)

# Only sent when model_id targets Ollama.
ollama:
  num_ctx: 32768            # Ollama's default context is far too small for an agent's system prompt
  think: false              # qwen3 thinking: ~15x slower per step for the same code on simple missions
